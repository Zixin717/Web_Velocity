<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity</title>

    <!-- 跨網域連結 -->
    <!-- Google font — 思源黑體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- preconnect 預告訪問該網站-->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- crossorigin 預告跨網域-->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet"> <!-- 嵌入字體到樣式裡-->

    <!-- css連結 -->
    <link rel="stylesheet" href="css/css_2.css">

</head>


<!-- 網站主體內容 start -->
<body>

        <!-- Banner start -->
            <div id="banner">
                <img src="img/img_0.png"><!-- 單標籤 -->

                <!-- Menu start -->
                <div id = menu>
                    <!-- 無序列表 start -->
                    <ul>
                        <li><a href="index.html#page2">品牌介紹</a></li>
                        <li><a href="index.html">新品快訊</a></li>
                        <li><a href="index.html#page3">熱銷排行</a></li>
                        <li><button type="button" id="openLoginBtn" class="open-login-btn">會員登入</button></li>
                        <li><a href="index.html#page4">聯絡我們</a></li>
                    <!-- 無序列表 end -->
                    </ul>
                <!-- Menu end -->
                </div>

            </div>
            <!-- Banner end -->


    <!-- 網站頁面 start -->
    <div class="container">

        <!-- Page 1 start -->
        <!-- flex-direction: row;  從左到右 -->

        <div id="page2P1">

            <!-- 側邊導覽 start -->
            <div class="sideBar">
                <div class="sideBarItem"><img src="img/img_3_1_4.jpg"></div>
                <div class="sideBarItem"><img src="img/img_3_2_4.jpg"></div>
                <div class="sideBarItem"><img src="img/img_3_3_4.jpg"></div>
                <div class="sideBarItem"><img src="img/img_3_4_4.jpg"></div>
                <div class="sideBarItem"><img src="img/img_3_5_4.jpg"></div>
            </div>
            <!-- 側邊導覽 end -->

            <!-- 外框箭頭 start -->
            <div class="carousel-Wrapper">
                <button class="nav-btn prev-btn">❮</button>

                        <div id="productPreview">
                            <div class="product"><img src="img/img_3_1_4.jpg" alt="原味口味"></div>
                            <div class="product"><img src="img/img_3_2_4.jpg" alt="草莓口味"></div>
                            <div class="product"><img src="img/img_3_3_4.jpg" alt="香草口味"></div>
                            <div class="product"><img src="img/img_3_4_4.jpg" alt="焦糖咖啡口味"></div>
                            <div class="product"><img src="img/img_3_5_4.jpg" alt="抹茶口味"></div>
                        </div>

                <button class="nav-btn next-btn">❯</button>

            <!-- 外框箭頭 end -->
            </div>            
                
            <!-- 介紹與購買 start -->
            <!-- flex-direction: column; 從上到下 -->
            <div class="information">

                    <div id="manual">
                        <h1 id="productTitle">Velocity 超能高蛋白粉 2.5kg</h1>
                        <p id="productFlavor" class="product-flavor"></p><!-- 口味由 JS 動態帶入 -->
                        <b id="productPrice">$ 1999</b>
                        <p id="productInstallment">分期 0 利率 低至 $666×3 期</p>
                    </div>
                    

                    <div id="salesVolume">
                        <p>
                            <span>已售出</span>
                            <b>3萬+</b>
                            <img src="img/svg/heart.svg" width= "20px">
                        </p>
                    </div>
                    

                    <!-- 預計配達時間 start -->
                    <!-- 記得改 svg 寬度 -->
                    <div class="tips">
                        <img src="img/svg/truck.svg">
                            <div class="shipText">
                                <p>預計配達時間 <span id="arrival-date">運算中……</span></p>
                                <p>運費：$0元起</p>
                                <p>如果訂單未能準時配達，您可以領取 $10 優惠券作為補償。</p>
                            </div>
                    </div>
                    <!-- 預計配達時間 end -->

                    <!-- 放心買 放心退 start -->
                    <!-- 記得改 svg 寬度 -->
                    <div class="tips">
                        <img src="img/svg/shopping_cart_add.svg">
                        <p class="shipText">健樂放心買 健樂安心退</p>
                    <!-- 放心買 放心退 end -->
                    </div>
                    

                    <!-- 購買按鈕 start -->
                    <div>
                        <button type="button" id="buy-btn1" class="buy-btn0 open-cart-btn">直接購買</button><br>
                        <button type="button" id="buy-btn2" class="buy-btn0 open-cart-btn">加入購物車</button>
                    <!-- 購買按鈕 end -->
                    </div>
                    
            <!-- 介紹與購買 end -->
            </div>
            
        <!-- Page 1 end -->
        </div>

    <!-- 網站頁面 end -->
    </div>


    <!-- 側邊購物籃底下的黑背景 -->
    <div id="cartOverlay" class="cart-overlay"></div>

    <!-- 側邊購物籃 start -->
        <!-- 購物車側邊欄：點擊加入購物車時從右側滑出 -->
    <div id="cartOverlay" class="cart-overlay"></div>
    <aside id="cartSidebar" class="cart-sidebar">
        <div class="cart-sidebar-header">
            <h2>購物車</h2>
            <button type="button" id="cartCloseBtn" class="cart-close-btn">✕</button>
        </div>
        <ul id="cartItemsList" class="cart-items-list"></ul>
        <div class="cart-sidebar-footer">
            <p class="cart-total">共 <span id="cartCount">0</span> 件 · 總計 <span id="cartTotalPrice">$ 0</span></p>
        </div>
    </aside>
    <!-- 側邊購物籃 end -->

    <!-- 會員登入 start -->
    <div id="loginOverlay" class="login-overlay"></div><!-- 會員登入 底下的黑背景 -->

    <aside id="userLogin" class="user-login">
        <div class="login-header">
            <h2>會員登入</h2>
            <button id="closeLoginBtn" class="close-login-btn">✕</button>
        </div>

        <hr>

        <div class="login-body">
            <form id="loginForm" class="login-form">
                <div class="login-group">
                    <input type="text" id="username" name="username" placeholder=" " required>
                    <label for="username">帳號</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder=" " required>
                    <label for="password">密碼</label>
                </div>
                
                <button type="submit" class="login-submit-btn" id="loginSubmitBtn">登入</button>
                <p class="login-footer">Join us <a href="Register.html">Register</a></p>
            </form>
        </div>
    <!-- 會員登入 end -->
    </aside>


<!-- 網站主體內容 end -->
</body>


<script src="js/js_2.js"></script>

</html>
