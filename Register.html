<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity | 註冊會員</title>

    <!-- css連結 -->
    <link rel="stylesheet" href="css/css_3_register.css">
    
</head>
<body>


    <div class="register-box">
        <div class="register-header">
            <h2>Velocity</h2>
            <p>建立帳號，隨時隨地 滿電出發</p>
        </div>

        <form class="register-form" action="你的後端接收網址" method="POST">
            <div class="input-group">
                <input type="text" id="reg-name" placeholder=" " required>
                <label for="reg-name">使用者名稱</label>
            </div>
            <div class="input-group">
                <input type="email" id="reg-email" placeholder=" " required>
                <label for="reg-email">電子信箱</label>
            </div>

            <div class="input-group">
                <input type="password" id="reg-pwd" placeholder=" " required>
                <label for="reg-pwd">設定密碼</label>
            </div>

            <div class="input-group">
                <input type="password" id="reg-pwd-confirm" placeholder=" " required>
                <label for="reg-pwd-confirm">再次確認密碼</label>
            </div>

            <button type="submit" class="submit-btn">立即註冊</button>
        </form>

        <div class="register-footer">
            已經有帳號了嗎？ <a href="index.html">返回登入</a>
        </div>
    </div>
</body>
</html>
