<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity - 會員中心</title>
    <style>
        /* ================= 基礎設定 ================= */
        :root {
            --primary-color: #00e5ff; /* 活力螢光藍，符合健身科技感 */
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-light: #f1f1f1;
            --text-gray: #aaaaaa;
            --danger: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* ================= 導覽列 ================= */
        header {
            background-color: #000;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
        }

        header h1 {
            color: var(--primary-color);
            font-size: 24px;
            letter-spacing: 2px;
            font-style: italic; /* 營造速度感 */
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        /* ================= 主要版面配置 ================= */
        .container {
            display: flex;
            max-width: 1200px;
            margin: 40px auto;
            gap: 30px;
            padding: 0 20px;
        }

        /* 左側選單 */
        .sidebar {
            width: 250px;
            background-color: var(--bg-card);
            border-radius: 10px;
            padding: 20px;
            height: fit-content;
        }

        .sidebar h3 {
            margin-bottom: 15px;
            color: var(--text-gray);
            font-size: 14px;
            text-transform: uppercase;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            margin-bottom: 10px;
        }

        .sidebar a {
            color: var(--text-light);
            text-decoration: none;
            display: block;
            padding: 10px 15px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .sidebar a.active, .sidebar a:hover {
            background-color: var(--primary-color);
            color: #000;
            font-weight: bold;
        }

        /* 右側內容區 */
        .main-content {
            flex: 1;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card h2 {
            border-left: 4px solid var(--primary-color);
            padding-left: 15px;
            margin-bottom: 25px;
        }

        /* ================= 會員資料表單 ================= */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--text-gray);
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 15px;
            background-color: #2a2a2a;
            border: 1px solid #333;
            color: white;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group input:disabled {
            background-color: #1a1a1a;
            color: var(--text-gray);
            cursor: not-allowed;
        }

        .btn-update {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
        }

        .btn-update:hover {
            background-color: #00b8cc;
        }

        /* ================= 訂單表格 ================= */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            color: var(--text-gray);
            font-weight: normal;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending { background-color: #f39c12; color: #fff; }
        .status-paid { background-color: #2ecc71; color: #fff; }
        .status-cancelled { background-color: #7f8c8d; color: #fff; }

        .btn-cancel {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            background-color: var(--danger);
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>VELOCITY</h1>
        <div class="nav-links">
            <a href="index.html">回首頁</a>
            <a href="#">購物車</a>
            <a href="#" style="color: var(--primary-color);">會員中心</a>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>My Account</h3>
            <ul>
                <li><a href="#profile" class="active">會員資料</a></li>
                <li><a href="#orders">訂單查詢</a></li>
                <li><a href="#">專屬優惠券</a></li>
                <li><a href="#" style="color: var(--danger); margin-top: 20px;">登出</a></li>
            </ul>
        </aside>

        <main class="main-content">
            
            <section id="profile" class="card">
                <h2>會員資料</h2>
                <div class="form-group">
                    <label>電子信箱 (帳號)</label>
                    <input type="email" value="Reporter@test.com" disabled>
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" value="Reporter">
                </div>
                <div class="form-group">
                    <label>聯絡電話</label>
                    <input type="tel" value="0912-345-678">
                </div>
                <div class="form-group">
                    <label>預設寄送地址</label>
                    <input type="text" value="台中公園">
                </div>
                <button class="btn-update">儲存修改</button>
            </section>

            <section id="orders" class="card">
                <h2>歷史訂單</h2>
                <table>
                    <thead>
                        <tr>
                            <th>訂單編號</th>
                            <th>下單日期</th>
                            <th>總金額</th>
                            <th>狀態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>#10025</td>
                            <td>2026-02-23</td>
                            <td>NT$ 5,998</td>
                            <td><span class="status-badge status-pending">待付款</span></td>
                            <td>
                                <button class="btn-cancel">取消訂單</button>
                            </td>
                        </tr>
                        <tr>
                            <td>#09882</td>
                            <td>2026-01-15</td>
                            <td>NT$ 2,999</td>
                            <td><span class="status-badge status-paid">已完成</span></td>
                            <td><a href="#" style="color: var(--primary-color); text-decoration: none;">查看明細</a></td>
                        </tr>
                        <tr>
                            <td>#09850</td>
                            <td>2026-01-10</td>
                            <td>NT$ 1,500</td>
                            <td><span class="status-badge status-cancelled">已取消</span></td>
                            <td>-</td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </main>
    </div>

</body>
</html>
